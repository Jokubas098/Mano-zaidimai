<style>
/* Layout: a three-pane mailbox. Cobalt rail for folders, a sorted list of unread cases, and the open letter as the evidence sheet. */
:root {
  --bg: #e9edfb;
  --pane: #ffffff;
  --pane-soft: #f2f4fd;
  --line: #d5dbf2;
  --ink: #111a44;
  --muted: #55608c;
  --rail: #1538c4;
  --rail-deep: #0e2788;
  --on-rail: #ffffff;
  --on-rail-soft: #cfd9ff;
  --accent: #1538c4;
  --marker: #ffdf2e;
  --marker-ink: #111a44;
  --fake: #c8132b;
  --real: #06784a;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1130; --pane: #141c47; --pane-soft: #1c2658; --line: #2c3873; --ink: #eef1ff; --muted: #a8b3df;
    --rail: #1538c4; --rail-deep: #0e2788; --accent: #a9bcff; --fake: #ff8293; --real: #5fe0ab; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1130; --pane: #141c47; --pane-soft: #1c2658; --line: #2c3873; --ink: #eef1ff; --muted: #a8b3df;
  --rail: #1538c4; --rail-deep: #0e2788; --accent: #a9bcff; --fake: #ff8293; --real: #5fe0ab; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1.02rem/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.rail :focus-visible { outline-color: var(--marker); }

.app { height: 100%; max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 320px) minmax(0, 1fr); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.app.wide { grid-template-columns: 220px minmax(0, 1fr); }
.app.wide .list { display: none; }

.rail { background: var(--rail); color: var(--on-rail); padding: 18px 12px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow-y: auto; }
.logo { font: 800 1.55rem/1 var(--display); letter-spacing: -.02em; padding-inline: 8px; }
.logo span { display: block; color: var(--marker); }
.acc { display: grid; gap: 4px; padding-inline: 8px; font-size: .84rem; color: var(--on-rail-soft); }
.acc select { font: 700 .95rem var(--body); padding: 7px 8px; border: 0; border-radius: 4px; background: var(--rail-deep); color: var(--on-rail); width: 100%; }
.folders { display: grid; gap: 3px; }
.folder { display: flex; justify-content: space-between; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 9px 10px; border-radius: 4px; color: var(--on-rail); font-weight: 700; text-decoration: none; }
.folder:hover { background: var(--rail-deep); }
.folder.on { background: var(--marker); color: var(--marker-ink); }
.folder b { font-variant-numeric: tabular-nums; font-size: .9rem; }
.pts { margin-top: auto; padding: 10px; background: var(--rail-deep); border-radius: 4px; display: flex; justify-content: space-between; align-items: baseline; color: var(--on-rail-soft); font-size: .88rem; }
.pts b { font: 800 1.4rem/1 var(--display); color: var(--on-rail); font-variant-numeric: tabular-nums; }
.note { font-size: .78rem; color: var(--on-rail-soft); padding-inline: 8px; }

.list { background: var(--pane); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; }
.listhead { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.listhead h2 { font-size: 1.35rem; }
.listhead p { color: var(--muted); font-size: .92rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; width: 100%; text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--pane-soft); }
.row.on { background: var(--pane-soft); box-shadow: inset 4px 0 0 var(--accent); }
.row .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row time { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .subj { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .snip { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .res { font-size: .84rem; font-weight: 700; }
.res.y { color: var(--real); }
.res.n { color: var(--fake); }
.empty { padding: 24px 16px; color: var(--muted); }

.reader { background: var(--bg); overflow-y: auto; min-width: 0; padding: 20px; display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; }
.reader > *, .list > * { flex-shrink: 0; }
.back { display: none; font-weight: 700; color: var(--accent); justify-self: start; padding: 4px 0; }
.scene { font-size: .96rem; color: var(--muted); max-width: 46em; }
.scene b { color: var(--ink); }
.mail { position: relative; background: var(--pane); padding: 22px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); max-width: 46em; width: 100%; min-width: 0; overflow: hidden; }
.mail:has(.stamp) { padding-bottom: 76px; }
.mail h1 { font-size: clamp(1.3rem, 3vw, 1.65rem); margin-bottom: 12px; overflow-wrap: anywhere; }
.from { display: grid; gap: 3px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); font-size: .96rem; }
.from div { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 8px; }
.from b { color: var(--muted); font-weight: 400; }
.addr { font-family: var(--mono); font-size: .88rem; overflow-wrap: anywhere; }
.lines { display: grid; gap: 10px; }
.line { overflow-wrap: anywhere; }
.linkbox { display: grid; gap: 6px; justify-items: start; }
.fakebtn { background: var(--accent); color: var(--pane); padding: 9px 16px; border-radius: 4px; font-weight: 700; }
.url { font: 500 .84rem/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

.seg { border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.done .seg.found, .done .seg.found:hover { background: var(--marker); color: var(--marker-ink); }

.stamp { position: absolute; right: 18px; bottom: 16px; padding: 5px 12px; border: 4px solid currentColor; border-radius: 6px; font: 800 1.35rem/1 var(--display); text-transform: uppercase; background: var(--pane); transform: rotate(-6deg); pointer-events: none; }
.stamp.fake { color: var(--fake); }
.stamp.real { color: var(--real); }
.stamp.hit { animation: thump .28s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes thump { from { transform: rotate(4deg) scale(2.2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }

.acts { display: flex; flex-wrap: wrap; gap: 10px; max-width: 46em; }
.act { padding: 12px 18px; border-radius: 4px; font-weight: 700; color: #fff; }
.act.a { background: #c8132b; }
.act.b { background: #06784a; }
.act.n { background: var(--marker); color: var(--marker-ink); }
.act:hover { filter: brightness(1.1); }
.act.g { background: var(--pane); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
button.fakebtn { cursor: pointer; }
button.fakebtn:hover { filter: brightness(1.15); }
.stats { margin: 0; display: grid; gap: 5px; padding: 10px; background: var(--rail-deep); border-radius: 4px; color: var(--on-rail); font-size: .86rem; }
.stats div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; }
.stats dt { color: var(--on-rail-soft); }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats .bad dd { color: var(--marker); }
.sheet .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; padding: 14px; }
.hurt { color: var(--fake); }
.browser { max-width: 46em; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); background: var(--pane); }
.ribbon { background: var(--marker); color: var(--marker-ink); padding: 7px 14px; font-weight: 700; font-size: .9rem; }
.bar { background: var(--pane-soft); padding: 9px 14px; font: 500 .88rem/1.4 var(--mono); overflow-wrap: anywhere; border-bottom: 1px solid var(--line); }
.inner { padding: 22px; display: grid; gap: 14px; }
.inner h2 { font-size: 1.5rem; }
.simf { display: grid; gap: 3px; }
.simf span { color: var(--muted); font-size: .92rem; }
.simf code { font: 500 .95rem var(--mono); background: var(--pane-soft); padding: 9px 11px; border-radius: 3px; overflow-wrap: anywhere; }
.draft { background: var(--pane-soft); padding: 12px 14px; border-radius: 3px; }
.wide-l { max-width: 46em; }
.dayline { padding-inline: 8px; font-weight: 700; font-size: .92rem; }
.morning { font-weight: 700; color: var(--ink) !important; }
.hint { font-size: .92rem; color: var(--muted); max-width: 46em; }

.report { background: var(--pane); padding: 18px 22px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); max-width: 46em; display: grid; gap: 10px; }
.report h3 { font-size: 1.25rem; }
.report ul, .rules { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.report .sc { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson { background: var(--pane-soft); padding: 10px 12px; font-weight: 700; }

.sheet { max-width: 46em; display: grid; gap: 18px; }
.sheet h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -.02em; }
.sheet h1 span { color: var(--accent); }
.sum { color: var(--muted); font-size: 1.1rem; }
.card { background: var(--pane); padding: 18px 22px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.card h2 { font-size: 1.2rem; margin-bottom: 10px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.log li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.log .res { white-space: nowrap; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app, .app.wide { display: block; height: auto; }
  .rail { padding: 14px 12px; gap: 12px; overflow: visible; }
  .folders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pts { margin-top: 0; }
  .rail .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
  .sheet .stats { grid-template-columns: minmax(0, 1fr); }
  .list { border-right: 0; }
  .app.reading .list { display: none; }
  .app.reading .rail { display: none; }
  .app:not(.reading):not(.wide) .reader { display: none; }
  .back { display: block; }
  .reader { padding: 16px 12px; }
  .mail { padding: 16px; }
  .mail:has(.stamp) { padding-bottom: 72px; }
}
@media (prefers-reduced-motion: reduce) { .stamp.hit { animation: none; } }
</style>

const LEVELS = { easy: '5–6 klasė', hard: '7–8 klasė' };
const FOLDERS = { gautieji: 'Gautieji', perskaityti: 'Perskaityti', lapas: 'Detektyvo lapas' };
const SHOWN = 7, START_EUR = 50, KEY = 'detektyvo-pastas-v7';
const $ = id => document.getElementById(id);
let level = 'easy', open = null, confirmReset = false, justStamped = false, sim = null;
let boxes = load();

function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.easy && v.easy.queue && v.hard && v.hard.queue) return v; } catch (e) {}
  return { easy: fresh('easy'), hard: fresh('hard') };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(boxes)); } catch (e) {} }
function fresh(lvl) {
  // Queue of every letter, dealt so each batch of 7 mixes risky and safe ones.
  const ids = CASES[lvl].map((_, i) => i);
  const risky = shuffle(ids.filter(i => CASES[lvl][i].fake)), calm = shuffle(ids.filter(i => !CASES[lvl][i].fake));
  const queue = [];
  while (risky.length || calm.length) {
    const n = Math.min(risky.length, Math.max(SHOWN - calm.length, 3 + Math.floor(Math.random() * 2)));
    queue.push(...shuffle([...risky.splice(0, n), ...calm.splice(0, SHOWN - n)]));
  }
  return { queue, order: queue.splice(0, SHOWN), done: {}, extras: [] };
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const box = () => boxes[level];
const view = () => { const h = location.hash.slice(1); return FOLDERS[h] ? h : 'gautieji'; };
const clean = s => s.replace(/\[\[\w\|(.+?)\]\]/g, '$1').replace(/^BTN:.*$/, '');
function inFolder(f) {
  return box().order.filter(i => {
    const d = box().done[i];
    return f === 'gautieji' ? !d : !!d;
  });
}
function parts(src) {
  const out = [], re = /\[\[(\w)\|(.+?)\]\]/g;
  let at = 0, m;
  while ((m = re.exec(src))) {
    if (m.index > at) out.push({ text: src.slice(at, m.index) });
    out.push({ id: m[1], text: m[2] });
    at = re.lastIndex;
  }
  if (at < src.length) out.push({ text: src.slice(at) });
  return out;
}
function makeSeg(text, id, live) {
  const s = el('span', 'seg', text);
  s.dataset.clue = id || '';
  return s;
}
function fill(node, src, live) {
  parts(src).forEach(p => {
    if (p.id) { node.append(makeSeg(p.text, p.id, live)); return; }
    p.text.match(/\s+|[^\s.!?]*[^.!?]*[.!?]*\s*/g).filter(Boolean).forEach(b => b.trim() ? node.append(makeSeg(b, '', live)) : node.append(b));
  });
}
function letter(c, live, onAct) {
  const mail = el('article', 'mail');
  const h = el('h1');
  fill(h, c.head[1][1], live);
  const from = el('div', 'from');
  const row = el('div');
  row.append(el('b', '', 'Nuo'));
  const addr = el('span', 'addr');
  fill(addr, c.head[0][1], live);
  row.append(addr);
  const row2 = el('div');
  row2.append(el('b', '', 'Kam'), el('span', '', 'tau, ' + c.time));
  from.append(row, row2);
  const lines = el('div', 'lines');
  c.lines.forEach(line => {
    if (line.startsWith('BTN:')) {
      const rest = line.slice(4), cut = rest.indexOf('|'), label = rest.slice(0, cut), url = rest.slice(cut + 1);
      const b = el('div', 'linkbox');
      if (live && onAct) { const go = el('button', 'fakebtn', label); go.id = 'letter-act'; go.addEventListener('click', onAct); b.append(go); } else b.append(el('span', 'fakebtn', label));
      if (url) { const u = el('span', 'url', 'Veda į: '); fill(u, url, live); b.append(u); }
      lines.append(b);
    } else {
      const p = el('p', 'line');
      fill(p, line, live);
      lines.append(p);
    }
  });
  mail.append(h, from, lines);

}
function reveal(mail, c, d, hit) {

function reportCard(c, d) {
  const rep = el('section', 'report');
  rep.append(el('h3', '', d.trapped ? 'Pakliuvai į spąstus' : d.right ? 'Gerai pasielgei' : 'Tikro laiško nepanaudojai'));
  if (!d.trapped) rep.append(el('p', '', c.fake ? 'Mygtuko nepaspaudei, todėl žalos nebuvo.' : d.pressed ? c.act.ok : c.lost));
  const ids = Object.keys(c.clues);

  rep.append(el('p', 'lesson', c.lesson));

}

const euro = n => n.toFixed(2).replace('.', ',') + ' €';
